{% extends "base.html" %}

{% block content %}
<div class="container py-5 text-center">
    <div class="mb-4">
        <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 5rem;"></i>
    </div>
    <h2 class="fw-bold mb-3">Invalid QR Code</h2>
    <p class="text-muted mb-4">The QR code you scanned is either invalid, expired, or the prescription no longer exists in our system.</p>
    <a href="{{ url_for('public.scan_qr') }}" class="btn btn-primary px-4 rounded-pill">
        <i class="bi bi-upc-scan me-2"></i>Scan Another Code
    </a>
</div>
{% endblock %}
